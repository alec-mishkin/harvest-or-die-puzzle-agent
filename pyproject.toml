[project]
name = "harvest-or-die-puzzle-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["interface"]          # add "game", "baselines" as you create them

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
